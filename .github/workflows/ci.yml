name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore CodeWF.AvaloniaControls.slnx

      - name: Build
        run: dotnet build CodeWF.AvaloniaControls.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/CodeWF.AvaloniaControls.Tests/CodeWF.AvaloniaControls.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/CodeWF.AvaloniaControls/CodeWF.AvaloniaControls.csproj -c Release --no-build -o artifacts/ci-packages

      - name: Pack themes
        run: dotnet pack src/CodeWF.AvaloniaControls.Themes/CodeWF.AvaloniaControls.Themes.csproj -c Release --no-build -o artifacts/ci-packages
